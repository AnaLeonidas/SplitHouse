          type: string
          format: uuid
          nullable: true
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
    MoradiaInsert:
      type: object
      required: [nome, endereco, tipo, codigo_convite]
      properties:
        nome:
          type: string
          example: República Toca do Saber
        endereco:
          type: string
          example: Rua das Flores, 123 - Centro
        tipo:
          type: string
          enum: [casa, apartamento]
        estimativa_moradores:
          type: integer
          nullable: true
          example: 4
        codigo_convite:
          type: string
          example: SPLIT-0427
        criado_por:
          type: string
          format: uuid

    # -------------------------------------------------------------- Membros
    MembroMoradia:
      type: object
      description: Tabela `public.membros_moradia`.
      properties:
        id:
          type: string
          format: uuid
        moradia_id:
          type: string
          format: uuid
        usuario_id:
          type: string
          format: uuid
        papel:
          type: string
          enum: [admin, morador]
          default: morador
        status:
          type: string
          enum: [pendente, aprovado, recusado, saiu]
          default: pendente
          description: |
            - `pendente`: pediu para entrar e aguarda o admin
            - `aprovado`: morador ativo
            - `recusado`: solicitação negada
            - `saiu`: saiu ou foi removido da casa
        nivel:
          type: integer
          default: 1
        titulo_nivel:
          type: string
          default: Iniciante
        xp:
          type: integer
          default: 0
          description: Pontos de experiência (usados no ranking).
        moedas:
          type: integer
          default: 0
          description: Saldo de moedas para a loja.
        entrou_em:
          type: string
          format: date-time
    MembroMoradiaInsert:
      type: object
      required: [moradia_id, usuario_id]
      properties:
        moradia_id:
          type: string
          format: uuid
        usuario_id:
          type: string
          format: uuid
        papel:
          type: string
          enum: [admin, morador]
          default: morador
        status:
          type: string
          enum: [pendente, aprovado]
          default: pendente
    MembroMoradiaUpdate:
      type: object
      properties:
        papel:
